name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      matrix:
        # See the supported Node.js release schedule at https://nodejs.org/en/about/releases
        node-version: [ 22.x, 24.x, 26.x ]
        kafka-image: [ "confluentinc/cp-kafka:8.3.2", "confluentinc/cp-kafka:7.9.6" ]
        # confluentinc/cp-kafka:8.3.2 is Kafka 4.3.2 (primary)
        # confluentinc/cp-kafka:7.9.6 is Kafka 3.9.2 (also supported)
        # https://docs.confluent.io/platform/current/installation/versions-interoperability.html

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Check code style
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        if: matrix.node-version != '26.x' || matrix.kafka-image != 'confluentinc/cp-kafka:8.3.2'
        env:
          KAFKA_IMAGE: ${{ matrix.kafka-image }}
        run: npm test

      - name: Run unit tests with coverage
        if: matrix.node-version == '26.x' && matrix.kafka-image == 'confluentinc/cp-kafka:8.3.2'
        env:
          KAFKA_IMAGE: ${{ matrix.kafka-image }}
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '26.x' && matrix.kafka-image == 'confluentinc/cp-kafka:8.3.2'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov
          fail_ci_if_error: true
