services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Group coordinator configuration for faster availability
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 300000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-setup:
    image: apache/kafka:3.9.2
    container_name: kafka-setup
    environment:
      PARTITION_COUNT: "${PARTITION_COUNT:-1}"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c '
        echo "Creating topic demo-topic with $${PARTITION_COUNT} partition(s)..." &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic demo-topic --bootstrap-server kafka:9092 --partitions "$${PARTITION_COUNT}" --replication-factor 1 &&
        echo "Topic creation completed."
      '
    restart: on-failure

  producer:
    build:
      context: .
      dockerfile: producer.Dockerfile
    container_name: kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "kafka-nodejs-demo"
      KAFKA_GROUP_ID: "kafka-nodejs-demo-group"
      KAFKA_TOPIC: "demo-topic"
      MESSAGE: "${MESSAGE:-hello from producer}"
      MESSAGE_COUNT: "${MESSAGE_COUNT:-1}"
      PARTITION: "${PARTITION:-}"
      FROM_BEGINNING: "true"
    restart: on-failure

  consumer:
    build:
      context: .
      dockerfile: consumer.Dockerfile
    container_name: kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      producer:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CLIENT_ID: "kafka-nodejs-demo"
      KAFKA_GROUP_ID: "kafka-nodejs-demo-group"
      KAFKA_TOPIC: "demo-topic"
      FROM_BEGINNING: "true"
    restart: on-failure
